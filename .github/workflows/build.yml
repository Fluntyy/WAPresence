name: Build & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release for this build'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64 & arm64)
            os: windows-latest
            target: win
            flags: --win --x64 --arm64
          - name: Linux (x64 & arm64)
            os: ubuntu-latest
            target: linux
            flags: --linux --x64 --arm64
          - name: macOS (x64 & arm64)
            os: macos-latest
            target: mac
            flags: --mac --x64 --arm64

    steps:
      - name: Checkout WAPresence
        uses: actions/checkout@v4
        with:
          path: WAPresence

      - name: Checkout Baileys fork
        uses: actions/checkout@v4
        with:
          repository: crowroser/Baileys
          ref: fix/update-profile-status-about
          path: Baileys

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2t64 || sudo apt-get install -y libarchive-tools libfuse2 || sudo apt-get install -y libarchive-tools || true

      - name: Build Baileys
        shell: bash
        run: |
          node WAPresence/scripts/prepare-baileys.js Baileys
          cd Baileys
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Install WAPresence dependencies
        working-directory: WAPresence
        run: pnpm install --no-frozen-lockfile

      - name: Run WAPresence tests
        working-directory: WAPresence
        run: pnpm test

      - name: Build WAPresence
        working-directory: WAPresence
        run: pnpm run build

      - name: Package with electron-builder
        working-directory: WAPresence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          pnpm exec electron-builder ${{ matrix.flags }} --publish never -c.mac.identity=null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wapresence-${{ matrix.target }}
          path: |
            WAPresence/release/*.exe
            WAPresence/release/*.blockmap
            WAPresence/release/*.AppImage
            WAPresence/release/*.deb
            WAPresence/release/*.tar.gz
            WAPresence/release/*.dmg
            WAPresence/release/*.zip
            WAPresence/release/*.yml
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten release artifacts
        run: |
          mkdir -p dist-release
          find release-artifacts -type f -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
